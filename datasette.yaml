# Datasette settings for browsing GEAR locally.
#   python scripts/export.py
#   datasette build/gear.db -m datasette.yaml
title: GEAR
description: Game Evidence Archive & Repository. Search, filter and browse the evidence.
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/
source: GEAR
databases:
  gear:
    tables:
      evidence:
        description: One row per evidence entry, such as a quest or mission, with its sequence (section 0).
        sort: id
        facets:
          - game
          - unit
          - status
          - array: tags
      events:
        description: One row per numbered section of an evidence entry. Filter with the facets, search with the box.
        sort: id
        facets:
          - game
          - evidence_title
          - layer
          - agency
          - act
          - if_done
          - if_not_done
          - status
          - branch
          - version
          - language
          - array: tags
      games:
        facets: [engagement]
      tags:
        description: Terms with definition and aspects.
      literature_links:
        description: Literature connected to GEAR through Zotero tags gear:<target>:<role>.
        facets: [target_type, role, target]
      labels:
        description: Coded values with English and German labels.
        facets: [field]
    queries:
      search:
        title: Search everything
        description: Full-text search across evidence, events, tags, translations and literature.
        sql: |-
          select 'event' as type, e.id as id, e.title, e.game, snippet(events_fts, -1, '[', ']', ' … ', 12) as hit, e.path
            from events_fts join events e on e.rowid = events_fts.rowid where events_fts match :q
          union all
          select 'evidence', q.id, q.title, q.game, snippet(evidence_fts, -1, '[', ']', ' … ', 12), q.path
            from evidence_fts join evidence q on q.rowid = evidence_fts.rowid where evidence_fts match :q
          union all
          select 'tag', t.tag, t.title, '', snippet(tags_fts, -1, '[', ']', ' … ', 12), t.path
            from tags_fts join tags t on t.rowid = tags_fts.rowid where tags_fts match :q
          union all
          select 'translation (' || tr.lang || ')', tr.of_path, tr.title, '', snippet(translations_fts, -1, '[', ']', ' … ', 12), tr.path
            from translations_fts join translations tr on tr.rowid = translations_fts.rowid where translations_fts match :q
          union all
          select 'literature', l.citekey, l.title, '', l.author, ''
            from literature_fts join literature l on l.rowid = literature_fts.rowid where literature_fts match :q
      evidence_by_tag:
        title: Evidence by tag
        description: All evidence entries with a tag, across games.
        sql: |-
          select x.id, x.game_title as game, x.title, x.unit, x.events, x.status, x.path
            from evidence_tags xt join evidence x on x.id = xt.evidence
           where xt.tag = :tag
           order by x.game, x.id
      tag_by_game:
        title: Tags by game
        description: How many evidence entries and events carry which tag in which game.
        sql: |-
          select xt.tag, x.game_title as game, count(*) as evidence, sum(x.events) as events
            from evidence_tags xt join evidence x on x.id = xt.evidence
           group by xt.tag, x.game
           order by xt.tag, evidence desc
      game_overview:
        title: Game overview
        description: Events of one game, in order, with the conditions of observation.
        sql: |-
          select e.evidence_title as evidence, e.id, e.title, e.observed_date, e.version, e.layer, e.agency, e.path
            from events e
           where e.game = :game
           order by e.evidence, e.n
      literature_for:
        title: Literature for a tag, game, evidence entry or event
        description: "Enter a tag name, a game folder name, an evidence ID (EVD-WOW-0001) or an event ID (EVD-WOW-0001.2)."
        sql: |-
          select ll.role, l.citekey, l.author, l.year, l.title, l.doi, l.url
            from literature_links ll join literature l on l.citekey = ll.citekey
           where ll.target = :target
           order by l.year
